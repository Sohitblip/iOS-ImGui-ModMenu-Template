name: Compile iOS Overlay Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_library:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos Environment
        run: |
          bash -c "$(curl -fsSL https://githubusercontent.com)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Compile via Native Theos Makefile
        run: |
          export THEOS=$HOME/theos
          make THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64" FINALPACKAGE=1

      - name: Upload Compiled Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-PUBG-Dylib
          path: .theos/obj/debug/*.dylib
